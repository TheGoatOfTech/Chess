<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARTHEIROS — Galeria de Arte Autoral</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{color-scheme:light;--cream:#F5EFE6;--sand:#D6BFA3;--wine:#6B241B;--olive:#555436;--ink:#1C1B18;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background-color:#F5EFE6;color:#1C1B18;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background-image:radial-gradient(rgba(28,27,24,.045) 1px,transparent 1px);background-size:3px 3px;overflow-x:hidden}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.btn{padding:.85rem 1.4rem;font-size:.78rem;letter-spacing:.06em;font-weight:600;border:1px solid #1C1B18;transition:transform .3s,filter .3s;cursor:pointer;background:transparent;color:#1C1B18}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #6B241B;outline-offset:3px}
.b-w{background:#6B241B;color:#F5EFE6;border-color:#6B241B}.b-o{background:#555436;color:#F5EFE6;border-color:#555436}
header{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:rgba(245,239,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid #1C1B18}
.wall{perspective:1000px}.slot{perspective:900px}
.frame{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer;box-shadow:14px 20px 30px rgba(28,27,24,.32);will-change:transform}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.f-black{padding:12px;background:#1C1B18}.f-wood{padding:12px;background:linear-gradient(135deg,#b08a58,#7a5a33)}
.f-gallery-white{padding:26px;background:#fbf8f2;border:5px solid #1C1B18}
.leap{animation:leap .7s cubic-bezier(.5,0,.2,1) forwards}
@keyframes leap{40%{transform:translateZ(120px) scale(1.08)}100%{transform:translateZ(280px) rotateY(180deg) scale(1.35);opacity:0}}
.pop{animation:pop .7s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:perspective(1200px) rotateY(-80deg) scale(.7);opacity:0}}
.kb{animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-2%,-1.5%)}}
.plaque{opacity:.55;transition:opacity .4s}.slot:hover .plaque{opacity:1}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.5)}}
.fade{animation:fade 1s}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.scroller{display:flex;gap:1.5rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}.scroller::-webkit-scrollbar{display:none}
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(28,27,24,.82)}
input,textarea{width:100%;border:1px solid #1C1B18;background:#F5EFE6;padding:.7rem;font:inherit;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head>
<body><div id="root"></div>
<script>
// ============ CONFIGURAÇÃO EDITÁVEL ============
const GALLERY_CONFIG = {
  name: "ARTHEIROS", curator: "Amanda Costa", city: "Campinas, SP",
  whatsapp: "5519999999999",                       // TROQUE: DDI+DDD+número da curadoria
  paymentLink: "https://pagamento.exemplo.com/artheiros", // TROQUE: link Pix/Cartão real
  tourSeconds: 7
};
// Imagens: geradas em SVG (páginas publicadas bloqueiam imagens remotas).
// Para fotos reais, troque `imageUrl` por URLs do Unsplash ou suas próprias.
const art = (bg, body) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="${bg}"/>${body}</svg>`);
const ARTWORKS = [
 { id:1, title:"Chão de Barro", artist:"Helena Duarte", artistBio:"Pintora campineira, formada pela Unicamp, trabalha com pigmentos de terra colhidos no interior paulista.", artistProcess:"Helena mistura óxidos e cola natural, e pinta no chão do ateliê, deixando a gravidade conduzir as camadas.", city:"Campinas, SP", category:"Artes Visuais", technique:"Pigmentos naturais sobre tela", dimensions:"90 × 110 cm", year:2024, price:4800, likes:128, frameStyle:"black", featuredInTour:true,
   curatedDescription:"Há telas que se olham e telas que se pisam com os olhos. Esta guarda o cheiro de terra depois da chuva.",
   imageUrl: art("#C9A57C",`<circle cx="210" cy="190" r="120" fill="#6B241B"/><rect x="60" y="300" width="290" height="120" fill="#555436"/><circle cx="300" cy="120" r="38" fill="#F5EFE6"/><path d="M40 440H370" stroke="#1C1B18" stroke-width="3"/>`) },
 { id:2, title:"Vaso Arco Lento", artist:"Tomás Ribeiro", artistBio:"Ceramista de Valinhos, queima em forno a lenha construído por ele mesmo.", artistProcess:"Cada peça é torneada em uma só sessão e queimada por 18 horas, aceitando as marcas do fogo.", city:"Valinhos, SP", category:"Cerâmica", technique:"Grés torneado, esmalte de cinzas", dimensions:"34 × 22 cm", year:2025, price:1350, likes:96, frameStyle:"gallery-white", featuredInTour:true,
   curatedDescription:"Um vaso que lembra uma arcada: o vazio dentro dele é a parte mais bem desenhada.",
   imageUrl: art("#E8DCC8",`<path d="M150 120h100c10 60 70 80 70 170 0 70-50 110-120 110S80 360 80 290c0-90 60-110 70-170z" fill="#6B241B"/><rect x="140" y="100" width="120" height="26" rx="8" fill="#555436"/><path d="M40 410H360" stroke="#1C1B18" stroke-width="3"/>`) },
 { id:3, title:"Janela às Quatro", artist:"Luíza Menezes", artistBio:"Fotógrafa documental, registra a luz em casas e fábricas antigas da região metropolitana.", artistProcess:"Luíza fotografa sempre na mesma hora do dia e revela em papel de algodão, sem retoques.", city:"Campinas, SP", category:"Fotografia", technique:"Impressão fine art em papel algodão", dimensions:"60 × 80 cm", year:2023, price:2200, likes:143, frameStyle:"black", featuredInTour:true,
   curatedDescription:"A tarde entra pela janela e deita no chão. Luíza só precisou esperar.",
   imageUrl: art("#BDB3A3",`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5EFE6"/><stop offset="1" stop-color="#9c8e7a"/></linearGradient></defs><path d="M110 460V210a90 90 0 0 1 180 0v250z" fill="url(#g)"/><path d="M290 460l90-30v-60l-90 40z" fill="#1C1B18" opacity=".35"/><path d="M200 120v340M110 260h180" stroke="#1C1B18" stroke-width="3"/>`) },
 { id:4, title:"Semente Dobrada", artist:"Caio Ferraz", artistBio:"Escultor de Sousas, usa madeira de demolição e bronze fundido.", artistProcess:"Caio esculpe a partir do veio da madeira, sem desenho prévio, até a forma 'aparecer'.", city:"Sousas, Campinas", category:"Arte & Natureza", technique:"Madeira de demolição e bronze", dimensions:"48 × 30 × 26 cm", year:2024, price:6900, likes:77, frameStyle:"wood", featuredInTour:true,
   curatedDescription:"Uma semente em pleno gesto de crescer. Olhe devagar: ela ainda se move.",
   imageUrl: art("#D9CBB4",`<path d="M200 80c90 30 130 130 90 220-30 70-110 90-150 40-40-50 10-100 50-120 30-20 10-70-40-60z" fill="#555436"/><ellipse cx="200" cy="440" rx="120" ry="16" fill="#1C1B18" opacity=".25"/><circle cx="170" cy="250" r="22" fill="#6B241B"/>`) },
 { id:5, title:"Herbário I — Aroeira", artist:"Marina Sato", artistBio:"Gravadora e botânica amadora, pesquisa a flora do cerrado paulista.", artistProcess:"Marina entinta folhas reais e imprime em prensa manual, tirando só dez exemplares de cada matriz.", city:"Campinas, SP", category:"Arte & Natureza", technique:"Gravura em relevo, edição de 10", dimensions:"40 × 55 cm", year:2025, price:980, likes:112, frameStyle:"gallery-white", featuredInTour:true,
   curatedDescription:"Uma folha que virou memória. Cada nervura é um mapa de onde ela viveu.",
   imageUrl: art("#F1E9D8",`<path d="M200 460C200 300 200 200 200 80" stroke="#555436" stroke-width="4" fill="none"/><g fill="#555436"><ellipse cx="150" cy="190" rx="50" ry="18" transform="rotate(-30 150 190)"/><ellipse cx="250" cy="250" rx="50" ry="18" transform="rotate(30 250 250)"/><ellipse cx="145" cy="320" rx="55" ry="18" transform="rotate(-25 145 320)"/><ellipse cx="255" cy="380" rx="50" ry="18" transform="rotate(25 255 380)"/></g><circle cx="200" cy="80" r="14" fill="#6B241B"/>`) },
 { id:6, title:"Estrela de Bolso", artist:"Coletivo Ateliê 13", artistBio:"Coletivo de seis artistas que produz peças pequenas em edição limitada.", artistProcess:"As peças passam por cinco mãos antes de ficarem prontas: desenho, molde, queima, pátina e assinatura.", city:"Campinas, SP", category:"Artes Visuais", technique:"Resina, pátina e folha de latão", dimensions:"18 × 18 × 6 cm", year:2026, price:640, likes:64, frameStyle:"wood", featuredInTour:true,
   curatedDescription:"Uma estrela para guardar na estante. Cabe na mão, mas ocupa a sala inteira.",
   imageUrl: art("#6B241B",`<path d="M200 90l30 110 110 30-110 30-30 110-30-110-110-30 110-30z" fill="#D6BFA3"/><circle cx="200" cy="230" r="26" fill="#555436"/>`) }
];
const CATS = ["Todas","Artes Visuais","Cerâmica","Fotografia","Arte & Natureza"];
const brl = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

// ============ APP ============
const {useState,useEffect,useRef} = React;
const html = htm.bind(React.createElement);
const Ic = ({d,s=20}) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d=${d}/></svg>`;
const P = {bag:"M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0", x:"M18 6 6 18M6 6l12 12", l:"m15 18-6-6 6-6", r:"m9 18 6-6-6-6", pause:"M6 4h4v16H6zM14 4h4v16h-4z", play:"M6 3l14 9-14 9z", heart:"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z", room:"M3 3h18v14H3zM7 21h10"};
const Logo = ({s=42}) => html`<svg viewBox="0 0 60 60" width=${s} height=${s} aria-hidden="true"><path d="M8 54V30a22 22 0 0 1 44 0v24" fill="none" stroke="#1C1B18" stroke-width="1.2"/><path d="M14 54V31a16 16 0 0 1 32 0v23" fill="none" stroke="#1C1B18" stroke-width=".6"/><path d="M16 54c0-12 4-18 12-18s8 8 6 18z" fill="#6B241B"/><path d="M30 54c0-8 3-12 9-12s7 6 5 12z" fill="#555436"/><path d="M38 14l1.7 4.6L44 20l-4.3 1.4L38 26l-1.7-4.6L32 20l4.3-1.4z" fill="#1C1B18"/><path d="M4 54h52M4 57h52" stroke="#1C1B18" stroke-width=".6"/></svg>`;
const Frame = ({a,cls="",style,...r}) => html`<div className=${`frame f-${a.frameStyle} ${cls}`} style=${style} ...${r}><img src=${a.imageUrl} alt=${a.title+', de '+a.artist}/></div>`;
const Like = ({a,liked,onLike}) => html`<button className="btn flex items-center gap-2" onClick=${()=>onLike(a.id)} aria-pressed=${liked} style=${{background:liked?'#6B241B':'transparent',color:liked?'#F5EFE6':'#1C1B18'}}><span key=${a.likes} className="bump inline-flex"><${Ic} d=${P.heart} s=${16}/></span>${liked?'Apreciada':'Apreciar obra'} · ${a.likes}</button>`;

function Tour({list,onClose,onAdd}) {
  const [i,setI]=useState(0),[pl,setPl]=useState(true),[pr,setPr]=useState(0),n=list.length,a=list[i];
  useEffect(()=>{ if(!pl) return; const t=setInterval(()=>setPr(p=>{ if(p>=100){ setI(x=>(x+1)%n); return 0 } return p+100/(GALLERY_CONFIG.tourSeconds*20) }),50); return ()=>clearInterval(t) },[pl,n]);
  const go=d=>{setI((i+d+n)%n);setPr(0)};
  return html`<div className="fixed inset-0 z-[70] flex flex-col" style=${{background:'#1C1B18',color:'#F5EFE6',paddingTop:'env(safe-area-inset-top,0px)'}}>
    <div className="flex gap-1 p-3">${list.map((_,k)=>html`<div key=${k} style=${{flex:1,height:2,background:'rgba(245,239,230,.25)'}}><div style=${{height:'100%',background:'#D6BFA3',width:(k<i?100:k===i?pr:0)+'%'}}/></div>`)}</div>
    <div className="flex-1 grid md:grid-cols-2 gap-8 items-center px-6 md:px-16 overflow-auto" style=${{perspective:1000}}>
      <div className="flex justify-center py-4"><div style=${{width:'min(70vw,340px)',aspectRatio:'4/5'}}><${Frame} a=${a} key=${'f'+a.id} style=${{width:'100%',height:'100%',boxShadow:'0 30px 60px rgba(0,0,0,.7)',cursor:'default',overflow:'hidden'}}/></div></div>
      <div key=${'t'+a.id} className="fade max-w-md">
        <p className="text-xs tracking-widest" style=${{color:'#D6BFA3'}}>Obra 0${i+1}/0${n} — Criada por ${a.artist}</p>
        <h2 className="serif italic text-4xl md:text-6xl my-3">${a.title}</h2>
        <p className="serif text-xl leading-relaxed">${a.curatedDescription}</p>
        <p className="text-sm opacity-80 mt-4 leading-relaxed">${a.artistBio} ${a.artistProcess}</p>
        <p className="text-sm mt-4" style=${{color:'#D6BFA3'}}>${a.technique} · ${a.dimensions} · ${brl(a.price)}</p>
      </div></div>
    <div className="flex flex-wrap items-center justify-center gap-3 p-4">
      <button className="btn" style=${{color:'#F5EFE6',borderColor:'#F5EFE6'}} aria-label="Anterior" onClick=${()=>go(-1)}><${Ic} d=${P.l} s=${16}/></button>
      <button className="btn" style=${{color:'#F5EFE6',borderColor:'#F5EFE6'}} onClick=${()=>setPl(!pl)}>${pl?'Pausar':'Continuar'}</button>
      <button className="btn" style=${{color:'#F5EFE6',borderColor:'#F5EFE6'}} aria-label="Próxima" onClick=${()=>go(1)}><${Ic} d=${P.r} s=${16}/></button>
      <button className="btn b-w" onClick=${()=>onAdd(a.id)}>Adquirir esta obra</button>
      <button className="btn" style=${{color:'#F5EFE6',borderColor:'#F5EFE6'}} onClick=${onClose}>Sair para a parede</button>
    </div></div>`;
}

function Room({a,onClose,liked,onLike,inCart,onAdd}) {
  const [room,setRoom]=useState(false);
  return html`<div className="overlay" style=${{perspective:1400}} onClick=${onClose}><div className="pop relative w-full max-w-5xl max-h-[92vh] overflow-auto grid md:grid-cols-2" style=${{background:'#F5EFE6',border:'1px solid #1C1B18'}} onClick=${e=>e.stopPropagation()}>
    <button className="absolute right-3 top-3 z-10" aria-label="Fechar" onClick=${onClose}><${Ic} d=${P.x}/></button>
    <div className="p-6 flex flex-col items-center justify-center gap-4" style=${{background:room?'#D6BFA3':'#E9E0D0',minHeight:380}}>
      ${room?html`<div style=${{width:'100%',maxWidth:340}}><div style=${{width:'46%',margin:'0 auto',aspectRatio:'4/5'}}><${Frame} a=${a} style=${{width:'100%',height:'100%',cursor:'default',boxShadow:'6px 10px 16px rgba(28,27,24,.35)'}}/></div>
        <svg viewBox="0 0 300 110" style=${{width:'100%',marginTop:14}} aria-label="Sofá minimalista para noção de escala"><rect x="20" y="30" width="260" height="55" rx="10" fill="#555436"/><rect x="10" y="50" width="40" height="50" rx="10" fill="#47462d"/><rect x="250" y="50" width="40" height="50" rx="10" fill="#47462d"/><rect x="40" y="95" width="6" height="12" fill="#1C1B18"/><rect x="254" y="95" width="6" height="12" fill="#1C1B18"/></svg></div>`
      :html`<div style=${{width:'min(100%,360px)',aspectRatio:'4/5'}}><${Frame} a=${a} style=${{width:'100%',height:'100%',cursor:'default'}}/></div>`}
      <button className="btn flex items-center gap-2" onClick=${()=>setRoom(!room)}><${Ic} d=${P.room} s=${16}/>${room?'Ver obra':'Ver na sala'}</button>
    </div>
    <div className="p-6 md:p-10">
      <p className="text-xs">${a.category} · ${a.city}</p>
      <h2 className="serif italic text-4xl md:text-5xl my-2">${a.title}</h2>
      <p className="serif text-2xl">${a.artist}</p>
      <p className="serif text-lg mt-4 leading-relaxed">${a.curatedDescription}</p>
      <p className="text-sm mt-3 leading-relaxed"><b>Sobre o artista. </b>${a.artistBio}</p>
      <p className="text-sm mt-2 leading-relaxed"><b>Processo criativo. </b>${a.artistProcess}</p>
      <dl className="grid grid-cols-2 gap-2 text-sm my-5 py-4" style=${{borderTop:'1px solid #1C1B18',borderBottom:'1px solid #1C1B18'}}>
        <div><dt className="opacity-60">Técnica</dt><dd>${a.technique}</dd></div><div><dt className="opacity-60">Dimensões</dt><dd>${a.dimensions}</dd></div>
        <div><dt className="opacity-60">Ano</dt><dd>${a.year}</dd></div><div><dt className="opacity-60">Valor</dt><dd>${brl(a.price)}</dd></div></dl>
      <div className="flex items-center gap-3 mb-5"><svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="27" fill="#555436"/><circle cx="29" cy="29" r="22" fill="none" stroke="#F5EFE6" stroke-width=".8"/><path d="M29 14l3 10 10 3-10 3-3 10-3-10-10-3 10-3z" fill="#F5EFE6"/></svg>
        <p className="text-xs leading-snug">Certificado de Autenticidade<br/>assinado por <span className="serif italic text-base">${GALLERY_CONFIG.curator}</span></p></div>
      <div className="flex flex-wrap gap-3"><${Like} a=${a} liked=${liked} onLike=${onLike}/>
        <button className="btn b-w" onClick=${()=>onAdd(a.id)}>${inCart?'Remover da sacola':'Adicionar à sacola'}</button></div>
    </div></div></div>`;
}

function Wall({arts,onOpen}) {
  const [cat,setCat]=useState("Todas"),[leap,setLeap]=useState(null);
  const list=arts.filter(a=>cat==="Todas"||a.category===cat), H=[360,300,420,330,390,310];
  const click=a=>{setLeap(a.id);setTimeout(()=>{setLeap(null);onOpen(a.id)},650)};
  return html`<section id="parede" className="px-6 md:px-16 py-20">
    <h2 className="serif text-4xl md:text-6xl mb-8">Acervo <i>na parede</i></h2>
    <div className="flex flex-wrap gap-2 mb-12">${CATS.map(c=>html`<button key=${c} className=${'btn '+(c===cat?'b-w':'')} onClick=${()=>setCat(c)}>${c}</button>`)}</div>
    <div className="wall grid sm:grid-cols-2 lg:grid-cols-3 gap-x-14 gap-y-16 items-end">
      ${list.map((a,k)=>html`<div key=${a.id} className="slot flex flex-col items-center" style=${{marginTop:k%2?40:0}}>
        <${Frame} a=${a} cls=${leap===a.id?'leap':''} tabIndex="0" role="button" aria-label=${'Abrir '+a.title} style=${{width:'min(100%,280px)',height:H[a.id-1]*0.8}}
          onKeyDown=${e=>e.key==='Enter'&&click(a)} onClick=${()=>click(a)}
          onMouseMove=${e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;e.currentTarget.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg) translateZ(18px)`}}
          onMouseLeave=${e=>e.currentTarget.style.transform=''}/>
        <div className="plaque mt-6 px-4 py-3 text-center text-xs" style=${{background:'#fbf8f2',border:'1px solid #1C1B18',minWidth:210}}>
          <div className="serif italic text-lg">${a.title}</div><div>${a.artist}</div><div className="opacity-70">${a.dimensions} · ${brl(a.price)}</div></div></div>`)}
    </div></section>`;
}

function Carousel({arts,likedSet,onLike,onOpen}) {
  const ref=useRef(),d=useRef(null),sorted=[...arts].sort((a,b)=>b.likes-a.likes);
  const sc=v=>ref.current.scrollBy({left:v,behavior:'smooth'});
  return html`<section id="apreciadas" className="py-20 px-6 md:px-16" style=${{background:'#555436',color:'#F5EFE6'}}>
    <div className="flex items-end justify-between mb-8"><h2 className="serif text-4xl md:text-6xl">Mais apreciadas <i>pelo público</i></h2>
      <div className="flex gap-2"><button className="btn" style=${{color:'#F5EFE6',borderColor:'#F5EFE6'}} aria-label="Anterior" onClick=${()=>sc(-320)}><${Ic} d=${P.l} s=${16}/></button><button className="btn" style=${{color:'#F5EFE6',borderColor:'#F5EFE6'}} aria-label="Próxima" onClick=${()=>sc(320)}><${Ic} d=${P.r} s=${16}/></button></div></div>
    <div ref=${ref} className="scroller" onPointerDown=${e=>{d.current={x:e.clientX,s:ref.current.scrollLeft}}} onPointerMove=${e=>{if(d.current&&e.buttons)ref.current.scrollLeft=d.current.s-(e.clientX-d.current.x)}} onPointerUp=${()=>d.current=null}>
      ${sorted.map((a,k)=>html`<article key=${a.id} className="shrink-0 p-5" style=${{width:290,scrollSnapAlign:'start',background:'#D6BFA3',color:'#1C1B18',border:'1px solid #1C1B18'}}>
        ${k<3&&html`<span className="inline-block text-xs px-3 py-1 mb-3" style=${{background:'#555436',color:'#F5EFE6'}}>Escolha do Público</span>`}
        <div style=${{height:230}} className="cursor-pointer" onClick=${()=>onOpen(a.id)}><img src=${a.imageUrl} alt=${a.title} draggable="false" style=${{width:'100%',height:'100%',objectFit:'cover',border:'6px solid #1C1B18'}}/></div>
        <h3 className="serif italic text-2xl mt-4">${a.title}</h3><p className="text-sm mb-3">${a.artist}</p>
        <${Like} a=${a} liked=${likedSet.has(a.id)} onLike=${onLike}/></article>`)}</div></section>`;
}

function Cart({arts,cart,onRemove,onClose}) {
  const items=cart.map(id=>arts.find(a=>a.id===id)),total=items.reduce((s,a)=>s+a.price,0);
  const [nome,setNome]=useState(''),[bairro,setBairro]=useState(''),[paid,setPaid]=useState(false),[err,setErr]=useState(false);
  const ok=()=>{ if(!items.length||!nome.trim()||!bairro.trim()){setErr(true);return false} setErr(false);return true };
  const zap=()=>{ if(!ok())return; const m=`Olá, Amanda! Gostaria de finalizar meu pedido na ARTHEIROS.\n\nNome: ${nome}\nRegião: ${bairro}\n\nObras:\n${items.map(a=>`• ${a.title} — ${a.artist} (${brl(a.price)})`).join('\n')}\n\nTotal: ${brl(total)}`; window.open(`https://wa.me/${GALLERY_CONFIG.whatsapp}?text=${encodeURIComponent(m)}`,'_blank') };
  const pay=()=>{ if(!ok())return; setPaid(true); setTimeout(()=>window.open(GALLERY_CONFIG.paymentLink,'_blank'),1500) };
  return html`<div className="fixed inset-0 z-[80]" style=${{background:'rgba(28,27,24,.5)'}} onClick=${onClose}><aside className="absolute right-0 top-0 bottom-0 w-full max-w-md flex flex-col p-6 overflow-auto" style=${{background:'#F5EFE6',borderLeft:'1px solid #1C1B18',paddingTop:'calc(1.5rem + env(safe-area-inset-top,0px))'}} onClick=${e=>e.stopPropagation()}>
    <div className="flex justify-between items-center mb-4"><h2 className="serif italic text-3xl">Sua sacola</h2><button aria-label="Fechar" onClick=${onClose}><${Ic} d=${P.x}/></button></div>
    ${!items.length&&html`<p className="text-sm opacity-70 py-8">Sua sacola está vazia. Escolha uma obra na parede e adicione aqui.</p>`}
    ${items.map(a=>html`<div key=${a.id} className="flex gap-3 py-3" style=${{borderBottom:'1px solid #1C1B18'}}><img src=${a.imageUrl} alt="" style=${{width:60,height:75,objectFit:'cover',border:'3px solid #1C1B18'}}/><div className="flex-1"><div className="serif italic text-lg">${a.title}</div><div className="text-xs">${a.artist}</div><div className="text-sm">${brl(a.price)}</div></div><button className="text-xs underline self-start" onClick=${()=>onRemove(a.id)}>Remover</button></div>`)}
    <div className="flex justify-between py-4 serif text-2xl"><span>Total</span><b>${brl(total)}</b></div>
    <div className="grid gap-3 mb-4"><input placeholder="Seu nome" value=${nome} onInput=${e=>setNome(e.target.value)} aria-label="Seu nome"/><input placeholder="Bairro / Cidade (ex: Cambuí, Campinas - SP)" value=${bairro} onInput=${e=>setBairro(e.target.value)} aria-label="Bairro e cidade"/></div>
    ${err&&html`<p className="text-sm mb-3" style=${{color:'#6B241B'}}>Adicione uma obra e preencha nome e bairro para continuar.</p>`}
    ${paid&&html`<p className="text-sm mb-3 p-3" style=${{background:'#D6BFA3'}}>Pedido confirmado. Abrindo o pagamento em instantes…</p>`}
    <div className="grid gap-3"><button className="btn b-w" onClick=${zap}>Finalizar pedido via WhatsApp</button><button className="btn b-o" onClick=${pay}>Pagar online (Pix / Cartão)</button></div></aside></div>`;
}

function Submit({onClose}) {
  const [f,setF]=useState({n:'',l:'',m:''}),[sent,setSent]=useState(false);
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const send=()=>{ if(!f.n.trim())return; window.open(`https://wa.me/${GALLERY_CONFIG.whatsapp}?text=${encodeURIComponent(`Olá! Sou ${f.n} e gostaria de submeter meu portfólio à ARTHEIROS.\nPortfólio: ${f.l}\n${f.m}`)}`,'_blank'); setSent(true) };
  return html`<div className="overlay" onClick=${onClose}><div className="pop w-full max-w-md p-8" style=${{background:'#F5EFE6',border:'1px solid #1C1B18',perspective:1200}} onClick=${e=>e.stopPropagation()}>
    <div className="flex justify-between"><h2 className="serif italic text-3xl">Submeter portfólio</h2><button aria-label="Fechar" onClick=${onClose}><${Ic} d=${P.x}/></button></div>
    ${sent?html`<p className="mt-6 text-sm">Recebido. A curadoria responde pelo WhatsApp em até 7 dias.</p>`:html`<div className="grid gap-3 mt-6"><input placeholder="Seu nome" value=${f.n} onInput=${set('n')} aria-label="Seu nome"/><input placeholder="Link do portfólio ou Instagram" value=${f.l} onInput=${set('l')} aria-label="Link do portfólio"/><textarea rows="3" placeholder="Conte sobre seu trabalho" value=${f.m} onInput=${set('m')} aria-label="Mensagem"/><button className="btn b-w" onClick=${send}>Enviar para a curadoria</button></div>`}</div></div>`;
}

function App() {
  const [arts,setArts]=useState(ARTWORKS),[liked,setLiked]=useState(new Set()),[cart,setCart]=useState([]);
  const [tour,setTour]=useState(false),[open,setOpen]=useState(null),[bag,setBag]=useState(false),[sub,setSub]=useState(false);
  const like=id=>{const had=liked.has(id);setLiked(s=>{const n=new Set(s);had?n.delete(id):n.add(id);return n});setArts(l=>l.map(a=>a.id===id?{...a,likes:a.likes+(had?-1:1)}:a))};
  const toggle=id=>setCart(c=>c.includes(id)?c.filter(x=>x!==id):[...c,id]);
  const add=id=>setCart(c=>c.includes(id)?c:[...c,id]);
  const cur=arts.find(a=>a.id===open);
  const links=[["Exposição","#hero"],["Mais Apreciadas","#apreciadas"],["Acervo na Parede","#parede"],["Curadoria","#curadoria"]];
  return html`<div>
    <header><div className="flex items-center justify-between px-4 md:px-10 py-3">
      <a href="#hero" className="flex items-center gap-3"><${Logo}/><span className="hidden sm:block leading-tight"><span className="serif text-xl tracking-[.2em] block">ARTHEIROS</span><span className="text-[9px] tracking-[.18em]">GALERIA DE ARTE AUTORAL</span></span></a>
      <nav className="hidden lg:flex gap-8 text-sm">${links.map(([t,h])=>html`<a key=${h} href=${h} className="hover:underline underline-offset-4">${t}</a>`)}</nav>
      <div className="flex items-center gap-3"><button className="btn hidden md:block" onClick=${()=>setTour(true)}>Iniciar visita guiada</button>
        <button className="relative p-2" aria-label=${'Sacola, '+cart.length+' obras'} onClick=${()=>setBag(true)}><${Ic} d=${P.bag} s=${24}/><span className="absolute -top-1 -right-1 text-[10px] w-5 h-5 rounded-full flex items-center justify-center" style=${{background:'#6B241B',color:'#F5EFE6'}}>${cart.length}</span></button></div></div></header>

    <section id="hero" className="relative min-h-screen flex items-center px-6 md:px-16 pt-28 pb-16 overflow-hidden">
      <svg className="absolute right-[-6%] top-24 hidden md:block" width="560" height="700" viewBox="0 0 280 350" fill="none" stroke="#1C1B18" aria-hidden="true"><path d="M20 340V150a120 120 0 0 1 240 0v190" strokeWidth="1"/><path d="M50 340V155a90 90 0 0 1 180 0v185" strokeWidth=".7"/><path d="M80 340V160a60 60 0 0 1 120 0v180" strokeWidth=".5"/><path d="M140 70l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" fill="#6B241B" stroke="none"/></svg>
      <div className="relative max-w-3xl"><h1 className="serif text-5xl md:text-8xl leading-[1.02]">Uma galeria que aproxima <i>artistas</i> e pessoas por meio da arte.</h1>
        <p className="mt-8 max-w-xl leading-relaxed">Em Campinas, a jornalista e curadora ${GALLERY_CONFIG.curator} seleciona obras autorais de artistas da região, cada uma com história, processo e certificado de autenticidade.</p>
        <div className="flex flex-wrap gap-4 mt-10"><button className="btn b-w" onClick=${()=>setTour(true)}>Iniciar exposição guiada</button><a href="#parede" className="btn b-o">Explorar acervo na parede</a></div></div></section>

    <${Carousel} arts=${arts} likedSet=${liked} onLike=${like} onOpen=${setOpen}/>
    <${Wall} arts=${arts} onOpen=${setOpen}/>

    <section id="curadoria" className="grid md:grid-cols-2" style=${{borderTop:'1px solid #1C1B18'}}>
      <div className="p-8 md:p-16" style=${{background:'#D6BFA3'}}><h2 className="serif text-4xl md:text-6xl">Curadoria de <i>${GALLERY_CONFIG.curator}</i></h2>
        <p className="mt-6 leading-relaxed">A Artheiros nasceu para dar rosto e voz a quem faz arte no interior paulista. Amanda visita os ateliês, escuta cada artista e escreve a história de cada obra, para que você leve para casa mais do que um objeto.</p></div>
      <div className="p-8 md:p-16"><h3 className="serif italic text-3xl">Entrega e parceria</h3>
        <p className="mt-4 leading-relaxed text-sm">Em Campinas, entregamos em mãos, com a obra embalada e montada se você quiser. Para o resto do Brasil, enviamos com seguro e embalagem de museu.</p>
        <p className="mt-3 leading-relaxed text-sm">É artista e quer expor com a gente? Mande seu portfólio para a curadoria.</p>
        <button className="btn b-w mt-6" onClick=${()=>setSub(true)}>Submeter portfólio como artista</button></div></section>
    <footer className="px-6 md:px-16 py-8 text-xs flex items-center gap-3" style=${{borderTop:'1px solid #1C1B18'}}><${Logo} s=${28}/>ARTHEIROS — Galeria de Arte Autoral · ${GALLERY_CONFIG.city}</footer>

    ${tour&&html`<${Tour} list=${arts.filter(a=>a.featuredInTour)} onClose=${()=>setTour(false)} onAdd=${add}/>`}
    ${cur&&html`<${Room} a=${cur} onClose=${()=>setOpen(null)} liked=${liked.has(cur.id)} onLike=${like} inCart=${cart.includes(cur.id)} onAdd=${toggle}/>`}
    ${bag&&html`<${Cart} arts=${arts} cart=${cart} onRemove=${toggle} onClose=${()=>setBag(false)}/>`}
    ${sub&&html`<${Submit} onClose=${()=>setSub(false)}/>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
