<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARTHEIROS — Galeria de Arte Autoral</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{
  color-scheme:dark;
  --wood-dark:#18100C;
  --wood-mid:#261912;
  --moss:#1F2418;
  --cream:#F5EFE6;
  --gold:#C5A880;
  --wine:#6B241B;
  --olive:#555436;
  --ink:#120E0B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  margin:0;
  background-color:var(--wood-dark);
  color:var(--cream);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(197,168,128,.14) 0%, transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 1px, transparent 1px, transparent 48px),
    linear-gradient(180deg, #1E140F 0%, #160F0B 50%, #1C130E 100%);
  overflow-x:hidden
}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* Botões de Museu */
.btn{
  padding:.85rem 1.45rem;
  font-size:.76rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  font-weight:600;
  border:1px solid var(--gold);
  transition:transform .3s,filter .3s,background .3s,color .3s;
  cursor:pointer;
  background:rgba(24,16,12,.55);
  color:var(--cream)
}
.btn:hover{transform:translateY(-2px);background:rgba(197,168,128,.16)}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.b-w{background:var(--wine);color:var(--cream);border-color:#9E3D30}
.b-w:hover{background:#7E2B20}
.b-o{background:var(--olive);color:var(--cream);border-color:#7C7B52}
.b-o:hover{background:#666541}

/* Header em Madeira Escura Translúcida */
header{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(20,13,10,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(197,168,128,.28)
}

/* Holofote acima das obras na parede */
.spotlight{position:relative}
.spotlight::before{
  content:"";
  position:absolute;
  top:-42px;
  left:50%;
  transform:translateX(-50%);
  width:280px;
  height:320px;
  background:radial-gradient(ellipse at top, rgba(255,232,190,.24) 0%, rgba(197,168,128,.07) 48%, transparent 74%);
  pointer-events:none;
  z-index:0;
  transition:opacity .4s;
}
.slot:hover .spotlight::before{
  background:radial-gradient(ellipse at top, rgba(255,236,200,.38) 0%, rgba(197,168,128,.14) 52%, transparent 76%);
}

/* Molduras Multi-camadas Realistas */
.wall{perspective:1100px}.slot{perspective:1000px}
.frame{
  position:relative;
  z-index:1;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
  cursor:pointer;
  box-shadow:
    0 24px 45px rgba(0,0,0,.78),
    0 8px 16px rgba(0,0,0,.6),
    inset 0 0 12px rgba(0,0,0,.65);
  will-change:transform
}
.frame img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  box-shadow:inset 0 0 8px rgba(0,0,0,.5);
}
.f-black{
  padding:14px;
  background:linear-gradient(145deg,#23201D,#0E0C0A);
  border:3px solid #3A322B;
  outline:1px solid rgba(197,168,128,.45);
  outline-offset:-10px;
}
.f-wood{
  padding:16px;
  background:linear-gradient(135deg,#7C5333 0%,#4B2E1B 48%,#694327 100%);
  border:3px solid #362012;
  outline:1px solid rgba(214,191,163,.4);
  outline-offset:-11px;
}
.f-gallery-white{
  padding:24px;
  background:#EFE8DC;
  border:8px solid #3B2416;
  outline:1px solid #C5A880;
  outline-offset:-16px;
}

.leap{animation:leap .7s cubic-bezier(.5,0,.2,1) forwards}
@keyframes leap{40%{transform:translateZ(120px) scale(1.08)}100%{transform:translateZ(280px) rotateY(180deg) scale(1.35);opacity:0}}
.pop{animation:pop .7s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:perspective(1200px) rotateY(-80deg) scale(.7);opacity:0}}
.kb{animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-2%,-1.5%)}}

/* Plaquinha de Museu em Bronze/Latão Escuro */
.plaque{
  opacity:.86;
  transition:opacity .4s, transform .4s;
  background:linear-gradient(180deg,#241A14,#18110D);
  border:1px solid rgba(197,168,128,.45);
  box-shadow:0 10px 20px rgba(0,0,0,.5);
}
.slot:hover .plaque{opacity:1;transform:translateY(-2px)}

/* Carrossel Contínuo em Loop (Marquee Infinito) */
.marquee-wrap{
  overflow:hidden;
  mask-image:linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
  -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
}
.marquee-track{
  display:flex;
  gap:1.75rem;
  width:max-content;
  animation:marqueeLoop 38s linear infinite;
}
.marquee-wrap:hover .marquee-track{
  animation-play-state:paused;
}
@keyframes marqueeLoop{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}

.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.5)}}
.fade{animation:fade 1s}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(10,7,5,.88);backdrop-filter:blur(6px)}
input,textarea{width:100%;border:1px solid rgba(197,168,128,.45);background:#221712;color:var(--cream);padding:.75rem;font:inherit;font-size:.9rem}
input::placeholder,textarea::placeholder{color:rgba(245,239,230,.45)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head>
<body><div id="root"></div>
<script>
// ============ CONFIGURAÇÃO EDITÁVEL ============
const GALLERY_CONFIG = {
  name: "ARTHEIROS",
  curator: "Amanda Costa",
  city: "Campinas, SP",
  whatsapp: "5519999999999", // TROQUE: DDI+DDD+número da curadoria
  paymentLink: "https://pagamento.exemplo.com/artheiros", // TROQUE: link Pix/Cartão real
  tourSeconds: 7,
  // Imagem principal do quadro emoldurado na entrada (Hero) — pode trocar por foto de galeria ou obra destaque
  heroImage: "https://images.unsplash.com/photo-1577720643272-265f09367456?auto=format&fit=crop&w=1000&q=85",
  heroCaption: "Salão Principal · Curadoria Inaugural Artheiros"
};

const fallbackArt = (title) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><radialGradient id="g" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#8C5A3C"/><stop offset="100%" stop-color="#2B1B12"/></radialGradient></defs><rect width="400" height="500" fill="url(#g)"/><circle cx="200" cy="220" r="95" fill="#6B241B" opacity=".8"/><text x="200" y="440" fill="#F5EFE6" font-family="Georgia,serif" font-size="18" text-anchor="middle">${title}</text></svg>`);

// Para colocar as fotos reais da cliente, troque `imageUrl` por "./assets/foto1.jpg", etc.
const ARTWORKS = [
 { id:1, title:"Chão de Barro", artist:"Helena Duarte", artistBio:"Pintora campineira, formada pela Unicamp, trabalha com pigmentos de terra colhidos no interior paulista.", artistProcess:"Helena mistura óxidos e cola natural, e pinta no chão do ateliê, deixando a gravidade conduzir as camadas.", city:"Campinas, SP", category:"Artes Visuais", technique:"Pigmentos naturais e óleo sobre tela", dimensions:"90 × 110 cm", year:2024, price:4800, likes:128, frameStyle:"wood", featuredInTour:true,
   curatedDescription:"Há telas que se olham e telas que se pisam com os olhos. Esta guarda o cheiro de terra depois da chuva.",
   imageUrl:"https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=800&q=85" },
 { id:2, title:"Vaso Arco Lento", artist:"Tomás Ribeiro", artistBio:"Ceramista de Valinhos, queima em forno a lenha construído por ele mesmo.", artistProcess:"Cada peça é torneada em uma só sessão e queimada por 18 horas, aceitando as marcas do fogo.", city:"Valinhos, SP", category:"Cerâmica", technique:"Grés torneado, esmalte de cinzas", dimensions:"34 × 22 cm", year:2025, price:1350, likes:96, frameStyle:"gallery-white", featuredInTour:true,
   curatedDescription:"Um vaso que lembra uma arcada: o vazio dentro dele é a parte mais bem desenhada.",
   imageUrl:"https://images.unsplash.com/photo-1610701596007-11502861dcfa?auto=format&fit=crop&w=800&q=85" },
 { id:3, title:"Janela às Quatro", artist:"Luíza Menezes", artistBio:"Fotógrafa documental, registra a luz em casas e fábricas antigas da região metropolitana.", artistProcess:"Luíza fotografa sempre na mesma hora do dia e revela em papel de algodão, sem retoques.", city:"Campinas, SP", category:"Fotografia", technique:"Impressão fine art em papel algodão", dimensions:"60 × 80 cm", year:2023, price:2200, likes:143, frameStyle:"black", featuredInTour:true,
   curatedDescription:"A tarde entra pela janela e deita no chão. Luíza só precisou esperar.",
   imageUrl:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=800&q=85" },
 { id:4, title:"Semente Dobrada", artist:"Caio Ferraz", artistBio:"Escultor de Sousas, usa madeira de demolição e bronze fundido.", artistProcess:"Caio esculpe a partir do veio da madeira, sem desenho prévio, até a forma 'aparecer'.", city:"Sousas, Campinas", category:"Arte & Natureza", technique:"Madeira de demolição e bronze", dimensions:"48 × 30 × 26 cm", year:2024, price:6900, likes:77, frameStyle:"wood", featuredInTour:true,
   curatedDescription:"Uma semente em pleno gesto de crescer. Olhe devagar: ela ainda se move.",
   imageUrl:"https://images.unsplash.com/photo-1544967082-d9d25d867d66?auto=format&fit=crop&w=800&q=85" },
 { id:5, title:"Herbário I — Aroeira", artist:"Marina Sato", artistBio:"Gravadora e botânica amadora, pesquisa a flora do cerrado paulista.", artistProcess:"Marina entinta folhas reais e imprime em prensa manual, tirando só dez exemplares de cada matriz.", city:"Campinas, SP", category:"Arte & Natureza", technique:"Gravura em relevo, edição de 10", dimensions:"40 × 55 cm", year:2025, price:980, likes:112, frameStyle:"gallery-white", featuredInTour:true,
   curatedDescription:"Uma folha que virou memória. Cada nervura é um mapa de onde ela viveu.",
   imageUrl:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=800&q=85" },
 { id:6, title:"Estrela de Bolso", artist:"Coletivo Ateliê 13", artistBio:"Coletivo de seis artistas que produz peças pequenas em edição limitada.", artistProcess:"As peças passam por cinco mãos antes de ficarem prontas: desenho, molde, queima, pátina e assinatura.", city:"Campinas, SP", category:"Artes Visuais", technique:"Resina, pátina e folha de latão", dimensions:"18 × 18 × 6 cm", year:2026, price:640, likes:64, frameStyle:"black", featuredInTour:true,
   curatedDescription:"Uma estrela para guardar na estante. Cabe na mão, mas ocupa a sala inteira.",
   imageUrl:"https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&w=800&q=85" }
];
const CATS = ["Todas","Artes Visuais","Cerâmica","Fotografia","Arte & Natureza"];
const brl = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

// ============ APP ============
const {useState,useEffect,useRef} = React;
const html = htm.bind(React.createElement);
const Ic = ({d,s=20}) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d=${d}/></svg>`;
const P = {
  bag:"M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0",
  x:"M18 6 6 18M6 6l12 12",
  l:"m15 18-6-6 6-6",
  r:"m9 18 6-6-6-6",
  heart:"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z",
  room:"M3 3h18v14H3zM7 21h10"
};

const Logo = ({s=42}) => html`<svg viewBox="0 0 60 60" width=${s} height=${s} aria-hidden="true">
  <path d="M8 54V30a22 22 0 0 1 44 0v24" fill="none" stroke="#C5A880" stroke-width="1.3"/>
  <path d="M14 54V31a16 16 0 0 1 32 0v23" fill="none" stroke="#C5A880" stroke-width=".7"/>
  <path d="M16 54c0-12 4-18 12-18s8 8 6 18z" fill="#8C3226"/>
  <path d="M30 54c0-8 3-12 9-12s7 6 5 12z" fill="#6E6D47"/>
  <path d="M38 14l1.7 4.6L44 20l-4.3 1.4L38 26l-1.7-4.6L32 20l4.3-1.4z" fill="#F5EFE6"/>
  <path d="M4 54h52M4 57h52" stroke="#C5A880" stroke-width=".7"/>
</svg>`;

const Frame = ({a,cls="",imgCls="",style,...r}) => html`<div className=${`frame f-${a.frameStyle} ${cls}`} style=${style} ...${r}>
  <div style=${{width:'100%',height:'100%',overflow:'hidden',background:'#120D0A'}}>
    <img src=${a.imageUrl} className=${imgCls} alt=${a.title+', de '+a.artist} onError=${e=>{e.currentTarget.onerror=null;e.currentTarget.src=fallbackArt(a.title)}}/>
  </div>
</div>`;

const Like = ({a,liked,onLike}) => html`<button className="btn flex items-center gap-2" onClick=${()=>onLike(a.id)} aria-pressed=${liked} style=${{background:liked?'#6B241B':'rgba(24,16,12,.6)',borderColor:liked?'#9E3D30':'#C5A880',color:'#F5EFE6'}}>
  <span key=${a.likes} className="bump inline-flex"><${Ic} d=${P.heart} s=${15}/></span>
  ${liked?'Apreciada':'Apreciar obra'} · ${a.likes}
</button>`;

function Tour({list,onClose,onAdd}) {
  const [i,setI]=useState(0),[pl,setPl]=useState(true),[pr,setPr]=useState(0),n=list.length,a=list[i];
  useEffect(()=>{ if(!pl) return; const t=setInterval(()=>setPr(p=>{ if(p>=100){ setI(x=>(x+1)%n); return 0 } return p+100/(GALLERY_CONFIG.tourSeconds*20) }),50); return ()=>clearInterval(t) },[pl,n]);
  const go=d=>{setI((i+d+n)%n);setPr(0)};
  return html`<div className="fixed inset-0 z-[70] flex flex-col" style=${{background:'radial-gradient(circle at 35% 45%, #2B1D16 0%, #0E0907 80%)',color:'#F5EFE6',paddingTop:'env(safe-area-inset-top,0px)'}}>
    <div className="flex gap-1.5 p-4">${list.map((_,k)=>html`<div key=${k} style=${{flex:1,height:2,background:'rgba(197,168,128,.25)'}}><div style=${{height:'100%',background:'#C5A880',width:(k<i?100:k===i?pr:0)+'%'}}/></div>`)}</div>
    <div className="flex-1 grid md:grid-cols-2 gap-8 items-center px-6 md:px-16 overflow-auto" style=${{perspective:1000}}>
      <div className="flex justify-center py-4 spotlight">
        <div style=${{width:'min(72vw,360px)',aspectRatio:'4/5'}}>
          <${Frame} a=${a} imgCls=${pl?'kb':''} key=${'f'+a.id} style=${{width:'100%',height:'100%',boxShadow:'0 35px 70px rgba(0,0,0,.85)',cursor:'default'}}/>
        </div>
      </div>
      <div key=${'t'+a.id} className="fade max-w-md">
        <p className="text-xs tracking-[.2em] uppercase" style=${{color:'#C5A880'}}>Sala de Exposição · Obra 0${i+1}/0${n}</p>
        <h2 className="serif italic text-4xl md:text-6xl my-3">${a.title}</h2>
        <p className="text-sm uppercase tracking-widest mb-4" style=${{color:'#C5A880'}}>${a.artist} · ${a.city}</p>
        <p className="serif text-2xl leading-relaxed italic opacity-95">“${a.curatedDescription}”</p>
        <p className="text-sm opacity-80 mt-4 leading-relaxed">${a.artistBio} ${a.artistProcess}</p>
        <p className="text-sm mt-5 pt-4" style=${{color:'#C5A880',borderTop:'1px solid rgba(197,168,128,.25)'}}>${a.technique} · ${a.dimensions} · <strong className="text-base text-[#F5EFE6]">${brl(a.price)}</strong></p>
      </div>
    </div>
    <div className="flex flex-wrap items-center justify-center gap-3 p-5" style=${{borderTop:'1px solid rgba(197,168,128,.2)',background:'rgba(14,9,7,.7)'}}>
      <button className="btn" aria-label="Anterior" onClick=${()=>go(-1)}><${Ic} d=${P.l} s=${16}/></button>
      <button className="btn" onClick=${()=>setPl(!pl)}>${pl?'Pausar Visita':'Continuar Visita'}</button>
      <button className="btn" aria-label="Próxima" onClick=${()=>go(1)}><${Ic} d=${P.r} s=${16}/></button>
      <button className="btn b-w" onClick=${()=>onAdd(a.id)}>Adquirir esta obra</button>
      <button className="btn" onClick=${onClose}>Voltar à galeria</button>
    </div>
  </div>`;
}

function Room({a,onClose,liked,onLike,inCart,onAdd}) {
  const [room,setRoom]=useState(false);
  return html`<div className="overlay" style=${{perspective:1400}} onClick=${onClose}>
    <div className="pop relative w-full max-w-5xl max-h-[92vh] overflow-auto grid md:grid-cols-2" style=${{background:'#1D1410',color:'#F5EFE6',border:'1px solid rgba(197,168,128,.45)',boxShadow:'0 30px 80px rgba(0,0,0,.9)'}} onClick=${e=>e.stopPropagation()}>
      <button className="absolute right-4 top-4 z-10 p-1 hover:opacity-75" aria-label="Fechar" onClick=${onClose}><${Ic} d=${P.x}/></button>
      <div className="p-8 flex flex-col items-center justify-center gap-6" style=${{background:room?'radial-gradient(circle at 50% 30%, #3E3228 0%, #1C1612 100%)':'radial-gradient(circle at 50% 35%, #2F2119 0%, #140D0A 100%)',minHeight:420,borderRight:'1px solid rgba(197,168,128,.2)'}}>
        ${room?html`<div style=${{width:'100%',maxWidth:350}}>
          <div style=${{width:'46%',margin:'0 auto',aspectRatio:'4/5'}}><${Frame} a=${a} style=${{width:'100%',height:'100%',cursor:'default',boxShadow:'0 16px 28px rgba(0,0,0,.65)'}}/></div>
          <svg viewBox="0 0 300 110" style=${{width:'100%',marginTop:18}} aria-label="Sofá minimalista para noção de escala">
            <rect x="20" y="30" width="260" height="55" rx="10" fill="#3D3C27"/>
            <rect x="10" y="50" width="40" height="50" rx="10" fill="#2E2D1D"/>
            <rect x="250" y="50" width="40" height="50" rx="10" fill="#2E2D1D"/>
            <rect x="40" y="95" width="6" height="12" fill="#0D0907"/><rect x="254" y="95" width="6" height="12" fill="#0D0907"/>
          </svg>
        </div>`
        :html`<div className="spotlight" style=${{width:'min(100%,350px)',aspectRatio:'4/5'}}><${Frame} a=${a} style=${{width:'100%',height:'100%',cursor:'default'}}/></div>`}
        <button className="btn flex items-center gap-2" onClick=${()=>setRoom(!room)}><${Ic} d=${P.room} s=${16}/>${room?'Ver obra isolada':'Simular na parede da sala'}</button>
      </div>
      <div className="p-6 md:p-10">
        <p className="text-xs tracking-widest uppercase" style=${{color:'#C5A880'}}>${a.category} · ${a.city}</p>
        <h2 className="serif italic text-4xl md:text-5xl my-2">${a.title}</h2>
        <p className="serif text-2xl" style=${{color:'#C5A880'}}>${a.artist}</p>
        <p className="serif italic text-lg mt-4 leading-relaxed opacity-95">“${a.curatedDescription}”</p>
        <p className="text-sm mt-4 leading-relaxed opacity-85"><b style=${{color:'#C5A880'}}>Sobre o artista: </b>${a.artistBio}</p>
        <p className="text-sm mt-2 leading-relaxed opacity-85"><b style=${{color:'#C5A880'}}>Processo criativo: </b>${a.artistProcess}</p>
        <dl className="grid grid-cols-2 gap-3 text-sm my-5 py-4" style=${{borderTop:'1px solid rgba(197,168,128,.25)',borderBottom:'1px solid rgba(197,168,128,.25)'}}>
          <div><dt className="text-xs uppercase tracking-wider opacity-60">Técnica</dt><dd>${a.technique}</dd></div>
          <div><dt className="text-xs uppercase tracking-wider opacity-60">Dimensões</dt><dd>${a.dimensions}</dd></div>
          <div><dt className="text-xs uppercase tracking-wider opacity-60">Ano</dt><dd>${a.year}</dd></div>
          <div><dt className="text-xs uppercase tracking-wider opacity-60">Investimento</dt><dd className="font-semibold text-base" style=${{color:'#C5A880'}}>${brl(a.price)}</dd></div>
        </dl>
        <div className="flex items-center gap-3 mb-6 p-3" style=${{background:'rgba(31,36,24,.65)',border:'1px solid rgba(197,168,128,.25)'}}>
          <svg width="48" height="48" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="27" fill="#555436"/><circle cx="29" cy="29" r="22" fill="none" stroke="#C5A880" stroke-width=".9"/><path d="M29 14l3 10 10 3-10 3-3 10-3-10-10-3 10-3z" fill="#F5EFE6"/></svg>
          <p className="text-xs leading-snug">Obra única com <strong>Certificado de Autenticidade</strong><br/>assinado pela curadora <span className="serif italic text-base" style=${{color:'#C5A880'}}>${GALLERY_CONFIG.curator}</span></p>
        </div>
        <div className="flex flex-wrap gap-3">
          <${Like} a=${a} liked=${liked} onLike=${onLike}/>
          <button className="btn b-w" onClick=${()=>onAdd(a.id)}>${inCart?'Remover da sacola':'Adicionar à sacola'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function Wall({arts,onOpen}) {
  const [cat,setCat]=useState("Todas"),[leap,setLeap]=useState(null);
  const list=arts.filter(a=>cat==="Todas"||a.category===cat), H=[370,310,420,340,390,320];
  const click=a=>{setLeap(a.id);setTimeout(()=>{setLeap(null);onOpen(a.id)},650)};
  return html`<section id="parede" className="px-6 md:px-16 py-24 relative">
    <div className="max-w-3xl mb-10">
      <p className="text-xs uppercase tracking-[.22em] mb-2" style=${{color:'#C5A880'}}>Salão Principal · Parede em Madeira Nobre</p>
      <h2 className="serif text-4xl md:text-6xl">Acervo <i>em exposição</i></h2>
      <p className="text-sm opacity-75 mt-3">Clique sobre qualquer moldura iluminada para destacá-la da parede e explorar a história da obra.</p>
    </div>
    <div className="flex flex-wrap gap-2 mb-16">${CATS.map(c=>html`<button key=${c} className=${'btn '+(c===cat?'b-w':'')} onClick=${()=>setCat(c)}>${c}</button>`)}</div>
    <div className="wall grid sm:grid-cols-2 lg:grid-cols-3 gap-x-14 gap-y-20 items-end">
      ${list.map((a,k)=>html`<div key=${a.id} className="slot flex flex-col items-center" style=${{marginTop:k%2?44:0}}>
        <div className="spotlight flex justify-center w-full">
          <${Frame} a=${a} cls=${leap===a.id?'leap':''} tabIndex="0" role="button" aria-label=${'Abrir '+a.title} style=${{width:'min(100%,285px)',height:H[a.id-1]*0.82}}
            onKeyDown=${e=>e.key==='Enter'&&click(a)} onClick=${()=>click(a)}
            onMouseMove=${e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;e.currentTarget.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg) translateZ(20px)`}}
            onMouseLeave=${e=>e.currentTarget.style.transform=''}/>
        </div>
        <div className="plaque mt-7 px-5 py-3.5 text-center text-xs" style=${{minWidth:230}}>
          <div className="serif italic text-xl" style=${{color:'#F5EFE6'}}>${a.title}</div>
          <div className="mt-0.5" style=${{color:'#C5A880'}}>${a.artist}</div>
          <div className="opacity-65 mt-1">${a.dimensions} · ${brl(a.price)}</div>
        </div>
      </div>`)}
    </div>
  </section>`;
}

// Carrossel contínuo em loop infinito (pausa ao passar o mouse)
function Carousel({arts,likedSet,onLike,onOpen}) {
  const sorted=[...arts].sort((a,b)=>b.likes-a.likes);
  const loopItems=[...sorted,...sorted];
  return html`<section id="apreciadas" className="py-24 relative" style=${{background:'linear-gradient(180deg, #1E2317 0%, #161A11 100%)',borderTop:'1px solid rgba(197,168,128,.25)',borderBottom:'1px solid rgba(197,168,128,.25)'}}>
    <div className="px-6 md:px-16 mb-12 flex flex-wrap items-end justify-between gap-4">
      <div>
        <p className="text-xs uppercase tracking-[.22em] mb-2" style=${{color:'#C5A880'}}>Vitrine de Destaques · Fluxo Contínuo</p>
        <h2 className="serif text-4xl md:text-6xl">Mais apreciadas <i>pelo público</i></h2>
      </div>
      <p className="text-xs opacity-70">Passe o cursor sobre uma obra para pausar e apreciar</p>
    </div>
    <div className="marquee-wrap py-2">
      <div className="marquee-track px-6">
        ${loopItems.map((a,idx)=>{
          const rank = idx % sorted.length;
          return html`<article key=${a.id+'-'+idx} className="shrink-0 p-6 flex flex-col justify-between transition-transform duration-300 hover:-translate-y-1" style=${{width:310,background:'linear-gradient(180deg,#251A14 0%,#19110D 100%)',border:'1px solid rgba(197,168,128,.35)',boxShadow:'0 20px 40px rgba(0,0,0,.55)'}}>
            <div>
              <div className="flex justify-between items-center mb-4">
                ${rank<3?html`<span className="text-[10px] uppercase tracking-widest px-2.5 py-1" style=${{background:'#6B241B',color:'#F5EFE6',border:'1px solid rgba(197,168,128,.4)'}}>Escolha do Público</span>`:html`<span className="text-xs opacity-60">Acervo Curado</span>`}
                <span className="text-xs" style=${{color:'#C5A880'}}>${brl(a.price)}</span>
              </div>
              <div style=${{height:250}} className="cursor-pointer mb-5" onClick=${()=>onOpen(a.id)}>
                <${Frame} a=${a} style=${{width:'100%',height:'100%',boxShadow:'0 14px 26px rgba(0,0,0,.7)'}}/>
              </div>
              <h3 className="serif italic text-2xl">${a.title}</h3>
              <p className="text-xs uppercase tracking-wider mt-1 mb-4" style=${{color:'#C5A880'}}>${a.artist}</p>
            </div>
            <${Like} a=${a} liked=${likedSet.has(a.id)} onLike=${onLike}/>
          </article>`;
        })}
      </div>
    </div>
  </section>`;
}

function Cart({arts,cart,onRemove,onClose}) {
  const items=cart.map(id=>arts.find(a=>a.id===id)),total=items.reduce((s,a)=>s+a.price,0);
  const [nome,setNome]=useState(''),[bairro,setBairro]=useState(''),[paid,setPaid]=useState(false),[err,setErr]=useState(false);
  const ok=()=>{ if(!items.length||!nome.trim()||!bairro.trim()){setErr(true);return false} setErr(false);return true };
  const zap=()=>{ if(!ok())return; const m=`Olá, Amanda! Gostaria de finalizar meu pedido na ARTHEIROS.\n\nNome: ${nome}\nRegião: ${bairro}\n\nObras:\n${items.map(a=>`• ${a.title} — ${a.artist} (${brl(a.price)})`).join('\n')}\n\nTotal: ${brl(total)}`; window.open(`https://wa.me/${GALLERY_CONFIG.whatsapp}?text=${encodeURIComponent(m)}`,'_blank') };
  const pay=()=>{ if(!ok())return; setPaid(true); setTimeout(()=>window.open(GALLERY_CONFIG.paymentLink,'_blank'),1500) };
  return html`<div className="fixed inset-0 z-[80]" style=${{background:'rgba(10,7,5,.75)',backdropFilter:'blur(4px)'}} onClick=${onClose}>
    <aside className="absolute right-0 top-0 bottom-0 w-full max-w-md flex flex-col p-6 overflow-auto" style=${{background:'#1A110D',color:'#F5EFE6',borderLeft:'1px solid rgba(197,168,128,.4)',paddingTop:'calc(1.5rem + env(safe-area-inset-top,0px))'}} onClick=${e=>e.stopPropagation()}>
      <div className="flex justify-between items-center mb-5 pb-3" style=${{borderBottom:'1px solid rgba(197,168,128,.25)'}}><h2 className="serif italic text-3xl">Sua sacola</h2><button aria-label="Fechar" onClick=${onClose}><${Ic} d=${P.x}/></button></div>
      ${!items.length&&html`<p className="text-sm opacity-70 py-10">Sua sacola está vazia. Selecione uma obra na parede da galeria para adquirir.</p>`}
      ${items.map(a=>html`<div key=${a.id} className="flex gap-3 py-3.5" style=${{borderBottom:'1px solid rgba(197,168,128,.2)'}}>
        <img src=${a.imageUrl} alt="" style=${{width:62,height:76,objectFit:'cover',border:'2px solid #C5A880'}}/>
        <div className="flex-1"><div className="serif italic text-xl">${a.title}</div><div className="text-xs" style=${{color:'#C5A880'}}>${a.artist}</div><div className="text-sm mt-1">${brl(a.price)}</div></div>
        <button className="text-xs underline opacity-75 hover:opacity-100 self-start" onClick=${()=>onRemove(a.id)}>Remover</button>
      </div>`)}
      <div className="flex justify-between py-5 serif text-2xl"><span>Total</span><b style=${{color:'#C5A880'}}>${brl(total)}</b></div>
      <div className="grid gap-3 mb-4"><input placeholder="Seu nome completo" value=${nome} onInput=${e=>setNome(e.target.value)} aria-label="Seu nome"/><input placeholder="Bairro / Cidade (ex: Cambuí, Campinas - SP)" value=${bairro} onInput=${e=>setBairro(e.target.value)} aria-label="Bairro e cidade"/></div>
      ${err&&html`<p className="text-xs mb-3" style=${{color:'#E07A6C'}}>Adicione pelo menos uma obra e preencha seu nome e bairro para continuar.</p>`}
      ${paid&&html`<p className="text-xs mb-3 p-3" style=${{background:'#2A3020',border:'1px solid #C5A880'}}>Pedido registrado. Abrindo o ambiente de pagamento em instantes…</p>`}
      <div className="grid gap-3 mt-auto pt-3"><button className="btn b-w" onClick=${zap}>Finalizar pedido via WhatsApp</button><button className="btn b-o" onClick=${pay}>Pagar online (Pix / Cartão)</button></div>
    </aside>
  </div>`;
}

function Submit({onClose}) {
  const [f,setF]=useState({n:'',l:'',m:''}),[sent,setSent]=useState(false);
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const send=()=>{ if(!f.n.trim())return; window.open(`https://wa.me/${GALLERY_CONFIG.whatsapp}?text=${encodeURIComponent(`Olá! Sou ${f.n} e gostaria de submeter meu portfólio à ARTHEIROS.\nPortfólio: ${f.l}\n${f.m}`)}`,'_blank'); setSent(true) };
  return html`<div className="overlay" onClick=${onClose}><div className="pop w-full max-w-md p-8" style=${{background:'#1D1410',color:'#F5EFE6',border:'1px solid rgba(197,168,128,.45)',perspective:1200}} onClick=${e=>e.stopPropagation()}>
    <div className="flex justify-between"><h2 className="serif italic text-3xl">Submeter portfólio</h2><button aria-label="Fechar" onClick=${onClose}><${Ic} d=${P.x}/></button></div>
    ${sent?html`<p className="mt-6 text-sm leading-relaxed">Portfólio encaminhado. A curadoria de ${GALLERY_CONFIG.curator} responde pelo WhatsApp em até 7 dias.</p>`:html`<div className="grid gap-3 mt-6"><input placeholder="Seu nome ou coletivo" value=${f.n} onInput=${set('n')} aria-label="Seu nome"/><input placeholder="Link do portfólio ou Instagram" value=${f.l} onInput=${set('l')} aria-label="Link do portfólio"/><textarea rows="3" placeholder="Conte brevemente sobre sua técnica e processo" value=${f.m} onInput=${set('m')} aria-label="Mensagem"/><button className="btn b-w" onClick=${send}>Enviar para a curadoria</button></div>`}
  </div></div>`;
}

function App() {
  const [arts,setArts]=useState(ARTWORKS),[liked,setLiked]=useState(new Set()),[cart,setCart]=useState([]);
  const [tour,setTour]=useState(false),[open,setOpen]=useState(null),[bag,setBag]=useState(false),[sub,setSub]=useState(false);
  const like=id=>{const had=liked.has(id);setLiked(s=>{const n=new Set(s);had?n.delete(id):n.add(id);return n});setArts(l=>l.map(a=>a.id===id?{...a,likes:a.likes+(had?-1:1)}:a))};
  const toggle=id=>setCart(c=>c.includes(id)?c.filter(x=>x!==id):[...c,id]);
  const add=id=>setCart(c=>c.includes(id)?c:[...c,id]);
  const cur=arts.find(a=>a.id===open);
  const links=[["Exposição","#hero"],["Mais Apreciadas","#apreciadas"],["Acervo na Parede","#parede"],["Curadoria","#curadoria"]];
  return html`<div>
    <header><div className="flex items-center justify-between px-4 md:px-10 py-3.5">
      <a href="#hero" className="flex items-center gap-3"><${Logo}/><span className="hidden sm:block leading-tight"><span className="serif text-xl tracking-[.22em] block" style=${{color:'#F5EFE6'}}>ARTHEIROS</span><span className="text-[9px] tracking-[.2em]" style=${{color:'#C5A880'}}>GALERIA DE ARTE AUTORAL</span></span></a>
      <nav className="hidden lg:flex gap-8 text-xs uppercase tracking-[.14em]">${links.map(([t,h])=>html`<a key=${h} href=${h} className="hover:text-[#C5A880] transition-colors">${t}</a>`)}</nav>
      <div className="flex items-center gap-3"><button className="btn hidden md:block" onClick=${()=>setTour(true)}>Iniciar visita guiada</button>
        <button className="relative p-2 hover:text-[#C5A880]" aria-label=${'Sacola, '+cart.length+' obras'} onClick=${()=>setBag(true)}><${Ic} d=${P.bag} s=${24}/><span className="absolute -top-0.5 -right-0.5 text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-semibold" style=${{background:'#6B241B',color:'#F5EFE6',border:'1px solid #C5A880'}}>${cart.length}</span></button></div></div></header>

    <section id="hero" className="relative min-h-screen grid lg:grid-cols-12 gap-10 items-center px-6 md:px-16 pt-28 pb-16 overflow-hidden">
      <div className="relative lg:col-span-7">
        <p className="text-xs uppercase tracking-[.25em] mb-4" style=${{color:'#C5A880'}}>Exposição Inaugural · ${GALLERY_CONFIG.city}</p>
        <h1 className="serif text-5xl md:text-7xl xl:text-8xl leading-[1.02]">Uma galeria que aproxima <i style=${{color:'#C5A880'}}>artistas</i> e pessoas por meio da arte.</h1>
        <p className="mt-8 max-w-xl leading-relaxed opacity-85">Em Campinas, a jornalista e curadora ${GALLERY_CONFIG.curator} seleciona obras autorais de artistas da região — cada peça apresentada em sala com sua história, processo criativo e certificado de autenticidade.</p>
        <div className="flex flex-wrap gap-4 mt-10">
          <button className="btn b-w" onClick=${()=>setTour(true)}>Iniciar exposição guiada</button>
          <a href="#parede" className="btn b-o">Explorar acervo na parede</a>
        </div>
      </div>

      <!-- Quadro Monumental de Exposição ao lado do Hero -->
      <div className="lg:col-span-5 flex flex-col items-center justify-center spotlight">
        <div className="frame f-wood w-full max-w-[390px] aspect-[4/5]" style=${{cursor:'pointer'}} onClick=${()=>setTour(true)}
          onMouseMove=${e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;e.currentTarget.style.transform=`perspective(1000px) rotateY(${x*12}deg) rotateX(${-y*12}deg) translateZ(14px)`}}
          onMouseLeave=${e=>e.currentTarget.style.transform=''}>
          <div style=${{width:'100%',height:'100%',overflow:'hidden',background:'#120D0A',position:'relative'}}>
            <img src=${GALLERY_CONFIG.heroImage} alt="Entrada da Exposição Artheiros" onError=${e=>{e.currentTarget.onerror=null;e.currentTarget.src=fallbackArt("Exposição Artheiros")}}/>
            <div style=${{position:'absolute',inset:0,background:'linear-gradient(180deg, transparent 58%, rgba(18,12,9,.85) 100%)',display:'flex',alignItems:'flex-end',padding:'1.25rem'}}>
              <span className="text-[11px] uppercase tracking-[.18em]" style=${{color:'#C5A880'}}>Clique para iniciar a visita guiada →</span>
            </div>
          </div>
        </div>
        <div className="plaque mt-5 px-5 py-2.5 text-center text-xs">
          <span className="serif italic text-base" style=${{color:'#F5EFE6'}}>${GALLERY_CONFIG.heroCaption}</span>
        </div>
      </div>
    </section>

    <${Carousel} arts=${arts} likedSet=${liked} onLike=${like} onOpen=${setOpen}/>
    <${Wall} arts=${arts} onOpen=${setOpen}/>

    <section id="curadoria" className="grid md:grid-cols-2" style=${{borderTop:'1px solid rgba(197,168,128,.25)'}}>
      <div className="p-8 md:p-16" style=${{background:'linear-gradient(135deg,#281B14 0%,#1B120D 100%)',borderRight:'1px solid rgba(197,168,128,.2)'}}>
        <p className="text-xs uppercase tracking-[.22em] mb-2" style=${{color:'#C5A880'}}>Direção Curatorial</p>
        <h2 className="serif text-4xl md:text-6xl">Curadoria de <i style=${{color:'#C5A880'}}>${GALLERY_CONFIG.curator}</i></h2>
        <p className="mt-6 leading-relaxed opacity-85">A Artheiros nasceu para dar rosto e voz a quem faz arte no interior paulista. Amanda visita os ateliês, escuta cada artista e escreve a história de cada obra, para que você leve para casa mais do que um objeto.</p>
      </div>
      <div className="p-8 md:p-16" style=${{background:'#16100C'}}>
        <h3 className="serif italic text-3xl" style=${{color:'#C5A880'}}>Entrega e parceria</h3>
        <p className="mt-4 leading-relaxed text-sm opacity-85">Em Campinas e região, entregamos em mãos, com a obra embalada e montada no seu espaço se desejar. Para o resto do Brasil, enviamos com seguro e embalagem técnica de museu.</p>
        <p className="mt-3 leading-relaxed text-sm opacity-85">É artista e quer expor na Artheiros? Envie seu portfólio para avaliação da curadoria.</p>
        <button className="btn b-w mt-7" onClick=${()=>setSub(true)}>Submeter portfólio como artista</button>
      </div>
    </section>

    <footer className="px-6 md:px-16 py-8 text-xs flex flex-wrap justify-between items-center gap-3" style=${{borderTop:'1px solid rgba(197,168,128,.25)',background:'#110B08',color:'#C5A880'}}>
      <div className="flex items-center gap-3"><${Logo} s=${28}/>ARTHEIROS — Galeria de Arte Autoral · ${GALLERY_CONFIG.city}</div>
      <span className="opacity-65">Curadoria assinada por ${GALLERY_CONFIG.curator}</span>
    </footer>

    ${tour&&html`<${Tour} list=${arts.filter(a=>a.featuredInTour)} onClose=${()=>setTour(false)} onAdd=${add}/>`}
    ${cur&&html`<${Room} a=${cur} onClose=${()=>setOpen(null)} liked=${liked.has(cur.id)} onLike=${like} inCart=${cart.includes(cur.id)} onAdd=${toggle}/>`}
    ${bag&&html`<${Cart} arts=${arts} cart=${cart} onRemove=${toggle} onClose=${()=>setBag(false)}/>`}
    ${sub&&html`<${Submit} onClose=${()=>setSub(false)}/>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
